name: Playwright Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ".node-version"
    - name: Setup npm 12
      run: npm install -g npm@12.2.1 --engine-strict=false
    - name: Get npm cache directory
      id: npm-cache
      run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.npm-cache.outputs.dir }}
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Check microCMS API
      env:
        MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      run: |
        for endpoint in blog tags; do
          code=$(curl -s -o /tmp/mcms-body -w "%{http_code}" \
            -H "X-MICROCMS-API-KEY: ${MICROCMS_API_KEY}" \
            "https://${MICROCMS_SERVICE_DOMAIN}.microcms.io/api/v1/${endpoint}?limit=1")
          echo "${endpoint}: ${code}"
        done
    - name: Run Playwright tests
      run: npm run test:e2e
      env:
        MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30